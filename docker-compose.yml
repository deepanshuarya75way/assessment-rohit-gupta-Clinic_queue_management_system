version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cqms-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cqms-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      NODE_ENV: production
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cqms-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT}:80"
    depends_on:
      - server
    env_file:
      - .env

volumes:
  pgdata:
